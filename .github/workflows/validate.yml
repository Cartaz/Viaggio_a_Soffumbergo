name: Source and reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_project.py
      - run: python tools/check_yaris_asset.py
      - run: gdparse godot/scripts/*.gd godot/tests/*.gd
      - run: gdformat --check godot/scripts/*.gd godot/tests/*.gd
      - run: gdlint godot/scripts/*.gd godot/tests/*.gd
      # Godot/Blender runtime validation remains a separate PC acceptance gate.
