name: Probe official FVG terrain distribution
on:
  push:
    branches: [feature/fvg-dtm-real-terrain-20261020]
    paths: [.github/workflows/probe_fvg_dtm.yml]
permissions:
  contents: read
jobs:
  check-official-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect FVG official Faedis grid sheet and 10m DTM only
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,html.parser,re,io,zipfile,json,hashlib,sys
          url="https://irdat.regione.fvg.it/CTRN/ricerca-cartografia/downloadsListAlfa.jsp?codice=0674&nome=FAEDIS&tipo=25K"
          req=urllib.request.Request(url,headers={"User-Agent":"Viaggio-a-Soffumbergo-DTM-research/0.2"})
          with urllib.request.urlopen(req,timeout=35) as response:
            raw=response.read(1_500_000)
            print("HTML HTTP",response.status,"bytes",len(raw),"content type",response.headers.get("Content-Type"))
          class Parser(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=="a":
                d=dict(attrs)
                if "href" in d:self.links.append(d["href"])
          parsed=Parser();parsed.feed(raw.decode("latin1",errors="replace"))
          links=[urllib.parse.urljoin(url,l) for l in parsed.links if "DTM" in l.upper()]
          text=raw.decode("latin1",errors="replace")
          print("Available official DTM links:")
          for l in links: print(l)
          for pattern in ("DTM", "DTM10", "zip", "onclick", "downloadFile", "download("):
            m=re.search(pattern,text,re.I)
            if m: print("HTML_FRAGMENT",pattern,repr(text[max(0,m.start()-260):m.end()+450]))
          print("ALL_HREF_FIRST_80",parsed.links[:80])
          candidates=[l for l in links if "10M" in l.upper() and ("6708" in l or "RDN2008" in l)]
          if not candidates:
            print("No appropriate directly linked 10m terrain grid on Faedis page");sys.exit(0)
          download=candidates[0]
          print("Selected documented official download",download)
          req=urllib.request.Request(download,headers={"User-Agent":"Viaggio-a-Soffumbergo-DTM-research/0.2"})
          with urllib.request.urlopen(req,timeout=55) as r:
            content=r.read(45_000_001); print("DTM download status",r.status,"bytes",len(content),"type",r.headers.get("Content-Type"))
          if len(content)>45_000_000: print("Too large for initial probe; skip");sys.exit(0)
          if not zipfile.is_zipfile(io.BytesIO(content)):
            print("Not an actual ZIP archive (not publishing)");sys.exit(0)
          archive=zipfile.ZipFile(io.BytesIO(content))
          print("ZIP entries:")
          for info in archive.infolist()[:35]:print(info.filename,info.file_size)
          print("ZIP_SHA256",hashlib.sha256(content).hexdigest())
          import pathlib
          pathlib.Path("build/geodata/fvg").mkdir(parents=True,exist_ok=True)
          pathlib.Path("build/geodata/fvg/faedis_10m_official.zip").write_bytes(content)
          pathlib.Path("build/geodata/fvg/faedis_10m_source.json").write_text(json.dumps({"source_url":download,"sha256":hashlib.sha256(content).hexdigest(),"archive_member_files":{i.filename:i.file_size for i in archive.infolist()}},indent=2),encoding="utf8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-fvg-faedis-dtm10m-probe
          path: build/geodata/fvg/
          if-no-files-found: warn
          retention-days: 7
