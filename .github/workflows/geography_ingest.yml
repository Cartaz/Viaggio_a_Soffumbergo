name: One-shot geographical source acquisition

# Runs only when this workflow file changes, or when manually started.
# NEVER commits an unreviewed OSM candidate or remote imagery to the repository.
on:
  push:
    paths:
      - '.github/workflows/geography_ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download Overpass regional 2D road network (one request)
        run: python tools/fetch_regional_roads.py --download
      - name: Derive review-only candidate for sector B
        continue-on-error: true
        run: |
          mkdir -p build/qgis
          python tools/extract_sector_b.py --input build/geodata/osm/regional_roads.geojson --output build/qgis/sector_b_candidate.geojson
      - name: Show recorded provenance
        if: always()
        run: |
          if [ -f build/geodata/osm/regional_roads_provenance.json ]; then
            cat build/geodata/osm/regional_roads_provenance.json
          else
            echo 'No external regional OSM download succeeded; no geometry certified.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soffumbergo-regional-osm-candidates
          path: |
            build/geodata/osm/
            build/qgis/sector_b_candidate.geojson
          if-no-files-found: warn
          retention-days: 7
