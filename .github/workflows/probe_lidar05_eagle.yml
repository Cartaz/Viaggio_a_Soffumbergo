name: Investigate FVG LiDAR 0.5m Eagle download

on:
  push:
    branches: [research/lidar-05-eagle-20261020]
    paths: [.github/workflows/probe_lidar05_eagle.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect official Eagle and DTM tile index
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,html.parser,re,zipfile,io,json
          USERAGENT={"User-Agent":"Viaggio-a-Soffumbergo-map-research/0.4"}
          class Parser(html.parser.HTMLParser):
            def __init__(self):
              super().__init__();self.links=[];self.scripts=[]
            def handle_starttag(self, tag, attrs):
              d=dict(attrs)
              if tag=="script" and d.get("src"):self.scripts.append(d["src"])
              if tag=="a" and d.get("href"):self.links.append(d["href"])
          pages=[
            ("eagle","https://eaglefvg.regione.fvg.it/eagle/main.aspx?configuration=guest"),
            ("tile_index","https://irdat.regione.fvg.it/Distributore/download?idDset=11769&idFmt=1902&type=kmlv&path=GRIGLIEGEO:QU_DTM_LIDAR_FVG"),
            ("index_wfs","https://serviziogc.regione.fvg.it/geoserver/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=GRIGLIEGEO%3AQU_DTM_LIDAR_FVG&bbox=13.39%2C46.155%2C13.395%2C46.159%2CEPSG%3A4326&outputFormat=application%2Fjson&maxFeatures=10"),
          ]
          for key,url in pages:
            print("\nCHECK",key,url)
            try:
              request=urllib.request.Request(url,headers=USERAGENT)
              with urllib.request.urlopen(request,timeout=28) as response:
                buf=response.read(2_500_001)
                print("STATUS",response.status,"MIME",response.headers.get("Content-Type"),"SIZE",len(buf),"FINAL",response.url)
              if len(buf)>2_500_000:
                print("Response >2.5MB, first 2.5MB only")
              print("FIRST",repr(buf[:180]))
              if key=="eagle":
                txt=buf.decode("utf-8",errors="replace")
                parser=Parser();parser.feed(txt)
                print("SCRIPTS",json.dumps([urllib.parse.urljoin(url,x) for x in parser.scripts][:90]))
                for term in ("scarico","download","carrello","ajax","service","WebService","layer"):
                  matches=list(re.finditer(term,txt,re.I))[:4]
                  for m in matches:print("HTML_FRAGMENT",term,repr(txt[max(0,m.start()-180):m.end()+220]))
              elif zipfile.is_zipfile(io.BytesIO(buf)):
                z=zipfile.ZipFile(io.BytesIO(buf))
                print("ZIP_FILES",[(i.filename,i.file_size) for i in z.infolist()[:15]])
                for i in z.infolist()[:5]:
                  if i.file_size<3_000_000:
                    data=z.read(i)
                    import pathlib
              pathlib.Path("build/eagle").mkdir(parents=True,exist_ok=True)
              pathlib.Path("build/eagle",filename).write_bytes(data)
              text=data.decode("utf-8",errors="replace")
                    print("ZIP_EXCERPT",i.filename,repr(text[:1600]))
              else:
                t=buf.decode("utf-8",errors="replace")
                print("TEXT_EXCERPT",repr(t[:7000]))
            except Exception as e:
              print("ERROR",key,type(e).__name__,str(e)[:700])
          PY
      - name: Inspect browser bundle for official download endpoint contracts
        run: |
          python - <<'PY'
          import urllib.request,collections,re,json
          base="https://eaglefvg.regione.fvg.it/eagle/"
          files=["main.cd58a1b277ee96a5.js","scripts.333ff9115ae2b76f.js"]
          for filename in files:
            url=base+filename
            print("BUNDLE",url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Viaggio-a-Soffumbergo-map-research/0.4"})
              with urllib.request.urlopen(req,timeout=38) as r:
                data=r.read(28_000_001);print("RECEIVED",len(data),"MIME",r.headers.get("Content-Type"))
              text=data.decode("utf-8",errors="replace")
              for term in ["download","carrello","cartographic","basCartogr","liDAR","lidar","eagleService","serviceUrl","endpoint","/api/","urlApi","downloadCart"]:
                occurrences=list(re.finditer(re.escape(term),text,re.I))
                print("TOKEN",term,"COUNT",len(occurrences))
                for m in occurrences[:3]:
                  print("CONTEXT",term,repr(text[max(0,m.start()-200):m.end()+280]))
              urls=re.findall(r'https?[:][\\/]{2}[A-Za-z0-9_\-./?&=%:+]+',text)
              useful=[u for u in urls if any(k in u.lower() for k in ["eagle","irdat","carto","api","insiel"])]
              print("RELEVANT_URLS",json.dumps(list(dict.fromkeys(useful))[:95]))
            except Exception as e:print("BUNDLE_ERROR",type(e).__name__,str(e)[:500])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eagle-browser-js-for-offline-analysis
          path: build/eagle/
          retention-days: 1
          if-no-files-found: warn
