name: Investigate FVG LiDAR 0.5m Eagle download
on:
  push:
    branches: [research/lidar-05-eagle-20261020]
    paths: [.github/workflows/probe_lidar05_eagle.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Capture public Eagle Angular app code for endpoint analysis
        run: |
          python - <<'PY'
          import urllib.request,pathlib,hashlib
          base="https://eaglefvg.regione.fvg.it/eagle/"
          out=pathlib.Path("build/eagle");out.mkdir(parents=True,exist_ok=True)
          for filename in ["main.cd58a1b277ee96a5.js","scripts.333ff9115ae2b76f.js"]:
              url=base+filename
              req=urllib.request.Request(url,headers={"User-Agent":"Viaggio-a-Soffumbergo-research/0.4"})
              with urllib.request.urlopen(req,timeout=40) as res:
                  payload=res.read(30_000_001)
                  print("STATUS",res.status,"URL",url,"BYTES",len(payload),"MIME",res.headers.get("Content-Type"))
              if len(payload)>30_000_000:raise ValueError("Bundle unexpectedly large")
              (out/filename).write_bytes(payload)
              print("SHA256",filename,hashlib.sha256(payload).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-eagle-app-bundles
          path: build/eagle/
          retention-days: 1
