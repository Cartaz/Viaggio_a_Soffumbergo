name: Test public FVG LiDAR raster coverage services
on:
  push:
    branches: [research/lidar-05-eagle-20261020]
    paths: [.github/workflows/probe_wcs_lidar05.yml]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check publicly documented regional GeoServer for WCS raster coverage
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          bases=[
            "https://irdat-ortofoto.regione.fvg.it/geoserver/ortofoto/ows",
            "https://serviziogc.regione.fvg.it/geoserver/ows",
            "https://irdat.regione.fvg.it/geoserver/ows",
          ]
          for base in bases:
            url=base+"?service=WCS&request=GetCapabilities&version=1.0.0"
            print("CHECK",url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Viaggio-a-Soffumbergo-research/0.4"})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(5_000_001)
                print("HTTP",response.status,"size",len(data),"MIME",response.headers.get("Content-Type"))
              text=data.decode("utf-8",errors="replace")
              print("HEADER",repr(text[:280]))
              names=re.findall(r'<(?:\w+:)?name>([^<]+)</(?:\w+:)?name>',text,re.I)
              print("NAMED_COVERAGES",len(names))
              print("MATCHING",[(x) for x in names if any(w in x.lower() for w in ["dtm","lidar","terrain","dem","elev","quota"])][:70])
              print("NAMES_SAMPLE",names[:12])
            except Exception as e:
              print("ERROR",type(e).__name__,str(e)[:700])
          PY
