name: Preserve validated FVG DTM review profile

on:
  push:
    branches: [feature/fvg-dtm-real-terrain-20261020]
    paths: [.github/workflows/preserve_fvg_profile.yml]

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retrieve previously sampled official DTM data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39374632568 --repo Cartaz/Viaggio_a_Soffumbergo \
            --name fvg-official-dtm10-route-review --dir build/terrain_candidate
      - name: Validate provenance, save source-derived samples, draw documentary SVG
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          source=Path("build/terrain_candidate/circuito_10m_raw_dtm_terrain_profile.json")
          doc=json.loads(source.read_text(encoding="utf-8"))
          assert doc["source_archive_sha256"]=="5e98b18802da5e49ed8fb05f0e114fdc29612907164f934238514b3f9c87d39b"
          assert doc["source_url"]=="https://irdat.regione.fvg.it/cartogdownload/DTM_PCR/10M/6708/DTM10_PCR_067_NO_RDN2008_TM33.zip"
          assert doc["status"]=="REAL_DTM_SAMPLED_NOT_SURVEYED_ROAD"
          assert doc["vertical_datum"]=="UNKNOWN_NOT_VERIFIED"
          assert doc["godot_ready"] is False
          assert doc["all_samples_present"] is True
          assert [x["sector"] for x in doc["sectors"]]==list("ABCVDEF")
          assert sum(s["sample_count"] for s in doc["sectors"])==2394
          assert abs(doc["total_length_projected_m"]-18884.861)<.1
          dest=Path("data/geography/circuito_dtm10_terrain_profile_20261020.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(source.read_bytes())
          PY
          python tools/plot_dtm_profile.py
          python tools/check_project.py
      - name: Commit only derived documentary data and chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/geography/circuito_dtm10_terrain_profile_20261020.json reports/terrain_10m_profile.svg
          git commit -m 'data(gis): preserve real 10m FVG DTM terrain samples and unverified-datum profile'
          git push origin HEAD:feature/fvg-dtm-real-terrain-20261020
