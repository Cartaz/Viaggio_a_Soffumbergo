<title id="title">Settore V — Via Monte Piccat e Piazza don Antonio Clemencig</title>
<desc id="desc">Pianta 2D da OSM: andata e ritorno sullo stesso asse, cinquanta tre edifici selezionati e tracciati pedonali potenziali. Quote, larghezze e fruibilità non verificate.</desc>
